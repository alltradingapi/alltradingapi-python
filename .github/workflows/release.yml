name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing / OIDC)
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write      # OIDC — no password/token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # One-time setup (PyPI → Publishing → pending publisher):
      #   owner: alltradingapi  repo: alltradingapi-python
      #   workflow: release.yml  environment: pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Quotex candles, assets, saved candles, candle history, chart images and trade result checks."
            echo
            echo "- Zero dependencies, standard library only"
            echo "- Sync and async clients"
            echo "- Typed, ships py.typed"
            echo "- Python 3.10+"
            echo
            echo "Install: \`pip install alltradingapi\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "alltradingapi $GITHUB_REF_NAME" --notes-file notes.md
