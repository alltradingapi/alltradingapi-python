  <text id="l1" x="40" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94A3B8" opacity="0">$ <tspan fill="#F8FAFC">pip install alltradingapi</tspan><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.25s" fill="freeze"/></text><text id="l2" x="40" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8" opacity="0">Successfully installed alltradingapi-1.0.0<animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.25s" fill="freeze"/></text><text id="l3" x="40" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94A3B8" opacity="0">$ <tspan fill="#F8FAFC">python quickstart.py</tspan><animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.25s" fill="freeze"/></text><text id="l4" x="40" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8" opacity="0">Analyzing EURUSD_otc · engine v5 · 300 candles<animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.25s" fill="freeze"/></text><text id="l5" x="40" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8" opacity="0">direction UP · confidence 76.0% · action TAKE TRADE<animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.25s" fill="freeze"/></text><text id="l6" x="40" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8" opacity="0">side CALL / BUY · tier TIER_A_PRIME · stake 1.00x<animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.25s" fill="freeze"/></text><text id="l7" x="40" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8" opacity="0">next candle opens 2026-11-20 21:06 (UTC-03:00)<animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.25s" fill="freeze"/></text><rect id="