name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test py${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (static type check)
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: mypy src
      - name: Tests with coverage
        # No network calls — tests use a local fake HTTP server only.
        run: pytest -q --cov=src/alltradingapi --cov-branch --cov-report=term
      - name: Enforce coverage gate (85%)
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: pytest -q --cov=src/alltradingapi --cov-branch --cov-fail-under=85

  build:
    name: build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Wheel smoke test (fresh venv)
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install dist/*.whl
          .venv-smoke/bin/python -c "import alltradingapi; print(alltradingapi.__version__)"
          .venv-smoke/bin/ata version
